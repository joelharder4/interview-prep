  <marker orient="auto-start-reverse" refY="5" refX="7.5" viewBox="0 0 10 10" markerHeight="6" markerWidth="6" id="arrow">
   <path id="svg_1" fill="#475569" d="m0,0l10,5l-10,5l0,-10z"/>
  </marker>
 </defs>
 <g>
  <title>Layer 1</title>
  <text id="svg_2" fill="#334155" font-size="12" text-anchor="middle" y="24" x="360">Top path = cache hit. Bottom path = cache miss then fill cache.</text>
  <rect id="svg_3" stroke="#60a5fa" fill="#dbeafe" rx="14" height="68" width="128" y="64.17021" x="44"/>
  <text id="svg_4" fill="#1e3a8a" font-size="13" text-anchor="middle" y="94.17021" x="108">Client</text>
  <text id="svg_5" fill="#1e3a8a" font-size="11" text-anchor="middle" y="112.17021" x="108">request</text>
  <path stroke="#475569" id="svg_19" marker-end="url(#arrow)" stroke-width="3" d="m307.89744,134.80597l0,32.1194"/>
  <rect id="svg_6" stroke="#4ade80" fill="#dcfce7" rx="14" height="72" width="172" y="64" x="236"/>
  <text id="svg_7" fill="#166534" font-size="13" text-anchor="middle" y="96" x="322">Cache Layer</text>
  <text id="svg_8" fill="#166534" font-size="11" text-anchor="middle" y="114" x="322">check freshness</text>
  <rect id="svg_9" stroke="#fbbf24" fill="#fef3c7" rx="14" height="72" width="172" y="172" x="236"/>
  <text id="svg_10" fill="#92400e" font-size="13" text-anchor="middle" y="204" x="322">Primary Store</text>
  <text id="svg_11" fill="#92400e" font-size="11" text-anchor="middle" y="222" x="322">source of truth</text>
  <rect id="svg_12" stroke="#a78bfa" fill="#ede9fe" rx="14" height="68" width="180" y="64.41026" x="492"/>
  <text id="svg_13" fill="#5b21b6" font-size="13" text-anchor="middle" y="94.41026" x="582">Response</text>
  <text id="svg_14" fill="#5b21b6" font-size="11" text-anchor="middle" y="112.41026" x="582">served to user</text>
  <path stroke="#475569" id="svg_15" marker-end="url(#arrow)" stroke-width="3" d="m172,98.17021l59.58209,0"/>
  <text id="svg_16" fill="#334155" font-size="9" text-anchor="middle" y="87.31915" x="203.40426">1) check cache</text>
  <path stroke="#475569" id="svg_17" marker-end="url(#arrow)" stroke-width="3" d="m408.72586,100l78.99145,0"/>
  <text id="svg_18" fill="#334155" font-size="10" text-anchor="middle" y="89.57265" x="446.8547">2a) cache hit</text>
  <text id="svg_20" fill="#334155" font-size="10" y="158.8547" x="255.65812">2b) miss</text>
  <path transform="rotate(-90 338.734 156.077)" stroke="#475569" id="svg_21" marker-end="url(#arrow)" stroke-width="3" d="m323.17096,156.07692l31.12821,0"/>
  <text id="svg_22" fill="#334155" font-size="10" text-anchor="middle" y="203.55555" x="497.7094">3) read DB</text>
  <path transform="rotate(179.965 498.37 174.693)" stroke="#475569" id="svg_23" marker-end="url(#arrow)" fill="none" stroke-width="3" d="m588.29614,136.6844l-179.85252,0.2687l0.31856,75.74839"/>
  <text id="svg_24" fill="#334155" font-size="10" text-anchor="middle" y="161.04274" x="422.37605">4) update cache for next request</text>
