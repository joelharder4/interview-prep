<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <line x1="170" y1="25" x2="170" y2="195" stroke="#94a3b8" stroke-width="2" />
  <line x1="550" y1="25" x2="550" y2="195" stroke="#94a3b8" stroke-width="2" />
  <text x="170" y="16" text-anchor="middle" font-size="12" fill="#1e293b">Browser</text>
  <text x="550" y="16" text-anchor="middle" font-size="12" fill="#1e293b">Server</text>

  <path d="M180 52H540" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#1e3a8a">ClientHello (TLS versions, ciphers)</text>

  <path d="M540 88H180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowBack)" />
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#14532d">ServerHello + Certificate</text>

  <path d="M180 124H540" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" />
  <text x="360" y="116" text-anchor="middle" font-size="11" fill="#5b21b6">Key Exchange</text>

  <path d="M540 158H180" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowBack)" />
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#7c2d12">Finished (encrypted channel active)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155" />
    </marker>
    <marker id="arrowBack" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#334155" />
    </marker>
  </defs>
</svg>
