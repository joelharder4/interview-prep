<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="40" width="100" height="44" rx="8" fill="#dbeafe" stroke="#93c5fd" />
  <text x="70" y="66" text-anchor="middle" font-size="11" fill="#1e3a8a">Enter URL</text>

  <rect x="140" y="40" width="100" height="44" rx="8" fill="#dcfce7" stroke="#86efac" />
  <text x="190" y="66" text-anchor="middle" font-size="11" fill="#14532d">DNS</text>

  <rect x="260" y="40" width="100" height="44" rx="8" fill="#ffedd5" stroke="#fdba74" />
  <text x="310" y="66" text-anchor="middle" font-size="11" fill="#7c2d12">TCP/TLS</text>

  <rect x="380" y="40" width="100" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd" />
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#4c1d95">HTTP GET</text>

  <rect x="500" y="40" width="110" height="44" rx="8" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="555" y="66" text-anchor="middle" font-size="11" fill="#0c4a6e">HTML Response</text>

  <rect x="630" y="40" width="110" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d" />
  <text x="685" y="66" text-anchor="middle" font-size="11" fill="#78350f">Parse &amp; Fetch</text>

  <path d="M120 62H140" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M240 62H260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M360 62H380" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M480 62H500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M610 62H630" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="80" y="132" width="260" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="210" y="156" text-anchor="middle" font-size="11" fill="#334155">Branch: DNS cache hit -> skip external resolver</text>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="#334155">Branch: HTTP cache fresh -> skip network fetch</text>

  <rect x="380" y="132" width="340" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="550" y="156" text-anchor="middle" font-size="11" fill="#334155">After HTML: fetch CSS/JS/images/fonts in parallel</text>
  <text x="550" y="178" text-anchor="middle" font-size="11" fill="#334155">Some assets may be inline or server-pushed/preloaded</text>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>
</svg>
