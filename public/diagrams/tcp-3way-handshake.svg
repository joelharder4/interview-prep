  <text x="550" y="16" text-anchor="middle" font-size="12" fill="#1e293b">Server</text>

  <path d="M180 55H540" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#1e3a8a">SYN (seq=x)</text>

  <path d="M540 98H180" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#14532d">SYN-ACK (seq=y, ack=x+1)</text>

