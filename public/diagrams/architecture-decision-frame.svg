 <g>
  <title>Layer 1</title>
  <text id="svg_2" fill="#334155" font-size="12" text-anchor="middle" y="24" x="360">Read left to right, then follow the bottom feedback arrow back to constraints.</text>
  <rect id="svg_3" stroke="#f472b6" fill="#fce7f3" rx="16" height="108" width="184" y="68" x="24"/>
  <text id="svg_4" fill="#831843" font-size="13" text-anchor="middle" y="102" x="116">1) Constraints</text>
  <text id="svg_5" fill="#831843" font-size="11" text-anchor="middle" y="124" x="116">users, scale, latency</text>
  <text id="svg_6" fill="#831843" font-size="11" text-anchor="middle" y="142" x="116">team size, budget</text>
  <rect id="svg_7" stroke="#a78bfa" fill="#ede9fe" rx="16" height="108" width="184" y="68" x="268"/>
  <text id="svg_8" fill="#5b21b6" font-size="13" text-anchor="middle" y="102" x="360">2) Design Choices</text>
  <text id="svg_9" fill="#5b21b6" font-size="11" text-anchor="middle" y="124" x="360">boundaries, APIs, storage</text>
  <text id="svg_10" fill="#5b21b6" font-size="11" text-anchor="middle" y="142" x="360">cache and async strategy</text>
  <rect id="svg_11" stroke="#4ade80" fill="#dcfce7" rx="16" height="108" width="184" y="68" x="512"/>
  <text id="svg_12" fill="#166534" font-size="13" text-anchor="middle" y="102" x="604">3) Tradeoffs</text>
  <text id="svg_13" fill="#166534" font-size="11" text-anchor="middle" y="124" x="604">speed vs simplicity</text>
  <text id="svg_14" fill="#166534" font-size="11" text-anchor="middle" y="142" x="604">availability vs cost</text>
  <path stroke="#475569" id="svg_15" marker-end="url(#arrow)" stroke-width="3" d="m208,122l55.51759,0"/>
  <text id="svg_16" fill="#334155" font-size="10" text-anchor="middle" y="113.50754" x="230.98492">informs</text>
  <path stroke="#475569" id="svg_17" marker-end="url(#arrow)" stroke-width="3" d="m452,122l55.01507,0"/>
